services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kdif-backend:latest
    container_name: kdif-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/data/fund_reporting.db
      UPLOAD_DIR: /app/data/uploads
      REPORT_DIR: /app/data/reports
      LOG_DIR: /app/data/logs
      CORS_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:5173
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kdif-frontend:latest
    container_name: kdif-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  backend_data:
    name: kdif_backend_data
